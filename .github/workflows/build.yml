name: Build and release

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: jxlarrea/kiosk-satellite
          ref: abc70b0839842e251b8d3917bbbb44569036556c
          path: .upstream/kiosk-satellite
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install pinned Android tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test
        run: python3 tools/test.py
      - name: Build
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            python3 tools/build.py --android-platform 35 --version "${GITHUB_REF_NAME#v}"
          else
            python3 tools/build.py --android-platform 35
          fi
      - name: Check upstream screensaver discovery contract
        run: python3 tools/check_upstream_screensaver.py .upstream/kiosk-satellite
      - name: Inspect and audit
        run: |
          python3 tools/inspect_package.py
          python3 tools/audit_repository.py
      - name: Prove deterministic packaging
        run: |
          cp dist/*.zip /tmp/first.zip
          rm -rf dist
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            python3 tools/build.py --android-platform 35 --version "${GITHUB_REF_NAME#v}"
          else
            python3 tools/build.py --android-platform 35
          fi
          cmp /tmp/first.zip dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: apple-shared-album-package
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/kiosk-satellite-plugin.json

  publish:
    if: github.event_name == 'release'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apple-shared-album-package
          path: dist
      - name: Validate and attach plugin assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          gh release upload "$GITHUB_REF_NAME" \
            dist/*.zip \
            dist/*.zip.sha256 \
            dist/kiosk-satellite-plugin.json --clobber --repo "$GITHUB_REPOSITORY"
